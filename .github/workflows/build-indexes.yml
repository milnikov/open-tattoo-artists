# Generates data/indexes/* after merge to main
name: build-indexes
on:
  push:
    branches: [main]
    paths:
      - 'data/artists/**'
      - 'data/styles/**'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build indexes
        run: python scripts/build_indexes.py
      - name: Commit and push indexes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/indexes/ && git diff --staged --quiet || (git commit -m "chore: rebuild indexes" && git push)
